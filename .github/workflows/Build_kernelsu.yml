name: Build KernelSU Boot Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for AOSP-Testkey-BootSigner (e.g., TB322FC_1.5.10.063)'
        required: false
        type: string
      runner_type:
        description: 'Select runner type'
        required: false
        default: 'linux'
        type: choice
        options:
          - linux
          - android

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl wget unzip git python3 python3-pip jq
          echo "Dependencies installed"

      - name: Create Kernelsu folder
        run: |
          mkdir -p Kernelsu
          cd Kernelsu
          pwd

      - name: Download KernelSU latest releases
        run: |
          cd Kernelsu
          echo "Downloading KernelSU components..."
          
          # Get the latest release information
          LATEST_RELEASE=$(curl -s "https://api.github.com/repos/tiann/KernelSU/releases/latest")
          
          # Download ksud-aarch64-unknown-linux-musl (suitable for Android)
          KSUD_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name=="ksud-aarch64-unknown-linux-musl") | .browser_download_url')
          
          if [ -z "$KSUD_URL" ] || [ "$KSUD_URL" == "null" ]; then
            echo "Failed to find ksud URL"
            echo "Available assets:"
            echo "$LATEST_RELEASE" | jq '.assets[].name'
            exit 1
          fi
          
          echo "Downloading ksud from: $KSUD_URL"
          wget -q --show-progress "$KSUD_URL" -O ksud || exit 1
          chmod +x ksud
          echo "✓ ksud downloaded"
          
          # Download android15-6.6_kernelsu.ko
          KO_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name=="android15-6.6_kernelsu.ko") | .browser_download_url')
          
          if [ -z "$KO_URL" ] || [ "$KO_URL" == "null" ]; then
            echo "Failed to find kernel module URL"
            echo "Available assets:"
            echo "$LATEST_RELEASE" | jq '.assets[].name'
            exit 1
          fi
          
          echo "Downloading kernel module from: $KO_URL"
          wget -q --show-progress "$KO_URL" -O android15-6.6_kernelsu.ko || exit 1
          
          # Rename android15-6.6_kernelsu.ko to android15-6.6
          mv android15-6.6_kernelsu.ko android15-6.6
          echo "✓ KernelSU components downloaded"

      - name: Download Magisk and extract magiskboot
        run: |
          cd Kernelsu
          echo "Downloading Magisk..."
          
          MAGISK_RELEASE=$(curl -s "https://api.github.com/repos/topjohnwu/Magisk/releases/latest")
          
          echo "Available Magisk assets:"
          echo "$MAGISK_RELEASE" | jq '.assets[].name'
          
          # Find the main Magisk APK (skip debug builds)
          MAGISK_URL=$(echo "$MAGISK_RELEASE" | jq -r '.assets[] | select(.name | contains("Magisk") and (contains(".apk") or contains(".zip"))) | select(.name | contains("debug") | not) | .browser_download_url' | head -1)
          
          if [ -z "$MAGISK_URL" ] || [ "$MAGISK_URL" == "null" ]; then
            echo "Failed to find Magisk APK/ZIP, trying alternative method..."
            MAGISK_URL=$(echo "$MAGISK_RELEASE" | jq -r '.assets[] | select(.name | endswith(".apk")) | select(.name | contains("debug") | not) | .browser_download_url' | head -1)
          fi
          
          if [ -z "$MAGISK_URL" ] || [ "$MAGISK_URL" == "null" ]; then
            echo "Error: Could not find suitable Magisk file"
            exit 1
          fi
          
          echo "Downloading from: $MAGISK_URL"
          wget -q --show-progress "$MAGISK_URL" -O magisk.apk || exit 1
          
          # Extract x86_64/magiskboot
          echo "Extracting magiskboot..."
          mkdir -p magisk_extracted
          unzip -q magisk.apk -d magisk_extracted || unzip -q magisk.apk -d magisk_extracted
          
          # Try to find magiskboot in various locations
          if [ -f "magisk_extracted/lib/x86_64/libmagiskboot.so" ]; then
            echo "Found libmagiskboot.so at lib/x86_64/"
            cp magisk_extracted/lib/x86_64/libmagiskboot.so magiskboot
          elif [ -f "magisk_extracted/assets/x86_64/magiskboot" ]; then
            echo "Found magiskboot at assets/x86_64/"
            cp magisk_extracted/assets/x86_64/magiskboot magiskboot
          elif [ -f "magisk_extracted/lib/arm64-v8a/libmagiskboot.so" ]; then
            echo "Found libmagiskboot.so at lib/arm64-v8a/"
            cp magisk_extracted/lib/arm64-v8a/libmagiskboot.so magiskboot
          else
            echo "Searching for magiskboot files..."
            find magisk_extracted -name "*magiskboot*" -type f
            find magisk_extracted -path "*/lib/*" -name "*.so" | head -10
            
            # Try to find any .so file
            SO_FILE=$(find magisk_extracted -name "*.so" | grep -E "(magisk|boot)" | head -1)
            if [ -n "$SO_FILE" ]; then
              echo "Using: $SO_FILE"
              cp "$SO_FILE" magiskboot
            else
              echo "Error: Could not find magiskboot in Magisk APK"
              ls -la magisk_extracted/
              exit 1
            fi
          fi
          
          chmod +x magiskboot
          rm -rf magisk_extracted magisk.apk
          echo "✓ Magisk extracted"

      - name: Download boot.img from AOSP-Testkey-BootSigner
        run: |
          cd Kernelsu
          echo "Downloading boot.img..."
          
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          RELEASE_TAG="${RELEASE_TAG:-TB322FC_1.5.10.063}"
          
          echo "Using release tag: $RELEASE_TAG"
          
          # Use jq to parse the JSON properly
          RELEASE_INFO=$(curl -s "https://api.github.com/repos/rin0011/AOSP-Testkey-BootSigner/releases/tags/$RELEASE_TAG")
          
          # Check if release was found
          if echo "$RELEASE_INFO" | jq -e '.message' > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG not found!"
            echo "Available releases:"
            curl -s "https://api.github.com/repos/rin0011/AOSP-Testkey-BootSigner/releases" | jq -r '.[].tag_name'
            exit 1
          fi
          
          # Extract boot.img download URL using jq
          BOOT_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name=="boot.img") | .browser_download_url')
          
          if [ -z "$BOOT_URL" ] || [ "$BOOT_URL" == "null" ]; then
            echo "Failed to find boot.img in release $RELEASE_TAG"
            echo "Available assets:"
            echo "$RELEASE_INFO" | jq '.assets[].name'
            exit 1
          fi
          
          echo "Downloading from: $BOOT_URL"
          wget -q --show-progress "$BOOT_URL" -O boot.img || exit 1
          echo "✓ boot.img downloaded"

      - name: Patch boot image with KernelSU
        run: |
          cd Kernelsu
          echo "Patching boot image..."
          
          if [ ! -f "boot.img" ]; then
            echo "Error: boot.img not found!"
            exit 1
          fi
          
          if [ ! -f "ksud" ]; then
            echo "Error: ksud not found!"
            exit 1
          fi
          
          if [ ! -f "android15-6.6" ]; then
            echo "Error: kernel module not found!"
            exit 1
          fi
          
          if [ ! -f "magiskboot" ]; then
            echo "Error: magiskboot not found!"
            exit 1
          fi
          
          # Check if ksud is executable
          file ksud
          
          # Run the patching command with proper parameters
          ./ksud boot-patch -b boot.img --magiskboot ./magiskboot --kmi android15-6.6 --out-name kernelsu_patch.img || {
            echo "Trying alternative parameters..."
            ./ksud boot-patch -b boot.img --magiskboot ./magiskboot --kmi android15-6.6 || exit 1
          }
          
          echo "✓ Boot image patched"

      - name: Rename patched boot image
        run: |
          cd Kernelsu
          echo "Renaming patched boot image..."
          
          # Find and rename the patched file
          PATCHED_FILE=$(ls -1 kernelsu_patch* 2>/dev/null | head -1)
          if [ -z "$PATCHED_FILE" ]; then
            echo "Error: No patched boot image found (kernelsu_patch*)"
            echo "Available files:"
            ls -la
            exit 1
          fi
          
          echo "Found patched file: $PATCHED_FILE"
          rm -f boot.img
          mv "$PATCHED_FILE" boot.img
          echo "✓ Patched image renamed to boot.img"

      - name: Download AOSP-Testkey-BootSigner for signing
        run: |
          cd Kernelsu
          echo "Cloning AOSP-Testkey-BootSigner..."
          
          git clone https://github.com/rin0011/AOSP-Testkey-BootSigner.git signer || exit 1
          cp boot.img signer/boot.img
          echo "✓ BootSigner cloned and boot.img copied"

      - name: Sign boot image with AVB
        run: |
          cd Kernelsu/signer
          echo "Signing boot image with AVB..."
          
          if [ ! -f "boot.img" ]; then
            echo "Error: boot.img not found in signer directory!"
            exit 1
          fi
          
          if [ ! -f "rebuild_avb.py" ]; then
            echo "Error: rebuild_avb.py not found!"
            echo "Available files:"
            ls -la
            exit 1
          fi
          
          # Install Python dependencies if needed
          python3 rebuild_avb.py --chained-mode || exit 1
          echo "✓ Boot image signed"

      - name: Verify signed boot image
        run: |
          cd Kernelsu/signer
          
          if [ ! -f "boot.img" ]; then
            echo "Error: Signed boot.img not found!"
            exit 1
          fi
          
          ls -lh boot.img
          echo "✓ Signed boot image ready"
          
          # Calculate checksum
          sha256sum boot.img

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-boot-img
          path: Kernelsu/signer/boot.img
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: Kernelsu/signer/boot.img
          tag_name: kernelsu-build-${{ github.run_number }}
          body: |
            KernelSU patched and signed boot image
            - Build number: ${{ github.run_number }}
            - Timestamp: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}
            
            This boot.img has been patched with KernelSU and signed with AOSP test keys in chained-mode.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
