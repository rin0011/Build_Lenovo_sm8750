name: Build KernelSU Boot Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for AOSP-Testkey-BootSigner (e.g., TB322FC_1.5.10.063)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget unzip git python3 python3-pip jq
          echo "✓ Dependencies installed"

      - name: Create Kernelsu folder
        run: |
          mkdir -p Kernelsu
          cd Kernelsu
          pwd

      - name: Download KernelSU latest releases
        run: |
          cd Kernelsu
          echo "Downloading KernelSU components..."
          
          # Get the latest release information with better error handling
          LATEST_RELEASE_URL="https://api.github.com/repos/tiann/KernelSU/releases/latest"
          echo "Fetching from: $LATEST_RELEASE_URL"
          
          curl -s -f "$LATEST_RELEASE_URL" > release.json || {
            echo "Failed to download release info"
            exit 1
          }
          
          # Validate JSON
          if ! jq empty release.json 2>/dev/null; then
            echo "Invalid JSON response"
            cat release.json
            exit 1
          fi
          
          # Extract tag name first
          TAG_NAME=$(jq -r '.tag_name' release.json)
          echo "Release tag: $TAG_NAME"
          
          # Download ksud-aarch64-unknown-linux-musl (suitable for Android)
          echo "Looking for ksud binary..."
          jq -r '.assets[] | select(.name=="ksud-aarch64-unknown-linux-musl") | .browser_download_url' release.json > ksud_url.txt
          KSUD_URL=$(cat ksud_url.txt)
          
          if [ -z "$KSUD_URL" ] || [ ! -s ksud_url.txt ]; then
            echo "Failed to find ksud URL"
            echo "Available assets:"
            jq -r '.assets[].name' release.json
            exit 1
          fi
          
          echo "Downloading ksud from: $KSUD_URL"
          wget -q --show-progress "$KSUD_URL" -O ksud || exit 1
          chmod +x ksud
          echo "✓ ksud downloaded"
          
          # Download android15-6.6_kernelsu.ko
          echo "Looking for kernel module..."
          jq -r '.assets[] | select(.name=="android15-6.6_kernelsu.ko") | .browser_download_url' release.json > ko_url.txt
          KO_URL=$(cat ko_url.txt)
          
          if [ -z "$KO_URL" ] || [ ! -s ko_url.txt ]; then
            echo "Failed to find kernel module URL"
            echo "Available assets:"
            jq -r '.assets[].name' release.json
            exit 1
          fi
          
          echo "Downloading kernel module from: $KO_URL"
          wget -q --show-progress "$KO_URL" -O android15-6.6_kernelsu.ko || exit 1
          
          # Rename android15-6.6_kernelsu.ko to android15-6.6
          mv android15-6.6_kernelsu.ko android15-6.6
          echo "✓ KernelSU components downloaded"
          
          # Cleanup
          rm -f release.json ksud_url.txt ko_url.txt

      - name: Download Magisk and extract magiskboot
        run: |
          cd Kernelsu
          echo "Downloading Magisk..."
          
          MAGISK_RELEASE_URL="https://api.github.com/repos/topjohnwu/Magisk/releases/latest"
          echo "Fetching from: $MAGISK_RELEASE_URL"
          
          curl -s -f "$MAGISK_RELEASE_URL" > magisk_release.json || {
            echo "Failed to download Magisk release info"
            exit 1
          }
          
          # Validate JSON
          if ! jq empty magisk_release.json 2>/dev/null; then
            echo "Invalid JSON response for Magisk"
            cat magisk_release.json | head -100
            exit 1
          fi
          
          echo "Available Magisk assets:"
          jq -r '.assets[].name' magisk_release.json
          
          # Find the main Magisk APK (skip debug builds and other files)
          jq -r '.assets[] | select(.name | contains(".apk") and (contains("debug") | not)) | .browser_download_url' magisk_release.json | head -1 > magisk_url.txt
          MAGISK_URL=$(cat magisk_url.txt)
          
          if [ -z "$MAGISK_URL" ] || [ ! -s magisk_url.txt ]; then
            echo "Failed to find Magisk APK"
            exit 1
          fi
          
          echo "Downloading Magisk from: $MAGISK_URL"
          wget -q --show-progress "$MAGISK_URL" -O magisk.apk || exit 1
          
          # Extract magiskboot
          echo "Extracting magiskboot..."
          mkdir -p magisk_extracted
          unzip -q magisk.apk -d magisk_extracted || {
            echo "Failed to extract magisk.apk"
            exit 1
          }
          
          # Try to find magiskboot in various locations
          BOOT_FOUND=0
          
          if [ -f "magisk_extracted/lib/x86_64/libmagiskboot.so" ]; then
            echo "Found libmagiskboot.so at lib/x86_64/"
            cp magisk_extracted/lib/x86_64/libmagiskboot.so magiskboot
            BOOT_FOUND=1
          elif [ -f "magisk_extracted/lib/arm64-v8a/libmagiskboot.so" ]; then
            echo "Found libmagiskboot.so at lib/arm64-v8a/"
            cp magisk_extracted/lib/arm64-v8a/libmagiskboot.so magiskboot
            BOOT_FOUND=1
          elif [ -f "magisk_extracted/assets/x86_64/magiskboot" ]; then
            echo "Found magiskboot at assets/x86_64/"
            cp magisk_extracted/assets/x86_64/magiskboot magiskboot
            BOOT_FOUND=1
          fi
          
          if [ $BOOT_FOUND -eq 0 ]; then
            echo "Searching for magiskboot files..."
            find magisk_extracted -name "*magiskboot*" -type f | head -5
            
            # Try to find any .so file with boot in name
            SO_FILE=$(find magisk_extracted -name "*boot*.so" | head -1)
            if [ -n "$SO_FILE" ]; then
              echo "Using: $SO_FILE"
              cp "$SO_FILE" magiskboot
              BOOT_FOUND=1
            fi
          fi
          
          if [ $BOOT_FOUND -eq 0 ]; then
            echo "Error: Could not find magiskboot in Magisk APK"
            echo "Contents of magisk_extracted/:"
            ls -la magisk_extracted/ | head -20
            exit 1
          fi
          
          chmod +x magiskboot
          rm -rf magisk_extracted magisk.apk magisk_release.json magisk_url.txt
          echo "✓ Magisk extracted"

      - name: Download boot.img from AOSP-Testkey-BootSigner
        run: |
          cd Kernelsu
          echo "Downloading boot.img..."
          
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          RELEASE_TAG="${RELEASE_TAG:-TB322FC_1.5.10.063}"
          
          echo "Using release tag: $RELEASE_TAG"
          
          # Download release info
          RELEASE_URL="https://api.github.com/repos/rin0011/AOSP-Testkey-BootSigner/releases/tags/$RELEASE_TAG"
          curl -s -f "$RELEASE_URL" > bootloader_release.json || {
            echo "Failed to download release: $RELEASE_TAG"
            echo "Fetching available releases..."
            curl -s "https://api.github.com/repos/rin0011/AOSP-Testkey-BootSigner/releases" | jq -r '.[].tag_name'
            exit 1
          }
          
          # Validate JSON
          if ! jq empty bootloader_release.json 2>/dev/null; then
            echo "Invalid JSON response"
            cat bootloader_release.json | head -100
            exit 1
          fi
          
          # Extract boot.img download URL
          echo "Looking for boot.img..."
          jq -r '.assets[] | select(.name=="boot.img") | .browser_download_url' bootloader_release.json > boot_url.txt
          BOOT_URL=$(cat boot_url.txt)
          
          if [ -z "$BOOT_URL" ] || [ ! -s boot_url.txt ]; then
            echo "Failed to find boot.img in release $RELEASE_TAG"
            echo "Available assets:"
            jq -r '.assets[].name' bootloader_release.json
            exit 1
          fi
          
          echo "Downloading from: $BOOT_URL"
          wget -q --show-progress "$BOOT_URL" -O boot.img || exit 1
          echo "✓ boot.img downloaded"
          
          # Cleanup
          rm -f bootloader_release.json boot_url.txt

      - name: Verify downloaded files
        run: |
          cd Kernelsu
          echo "Verifying downloaded files..."
          
          for file in ksud android15-6.6 magiskboot boot.img; do
            if [ -f "$file" ]; then
              ls -lh "$file"
              file "$file"
            else
              echo "ERROR: $file not found!"
              exit 1
            fi
          done
          
          echo "✓ All files verified"

      - name: Patch boot image with KernelSU
        run: |
          cd Kernelsu
          echo "Patching boot image..."
          
          # Run the patching command
          if bash ksud boot-patch -b boot.img --magiskboot ./magiskboot --kmi android15-6.6; then
            echo "✓ Boot image patched successfully"
          else
            echo "Patching failed, trying with --out-name parameter..."
            bash ksud boot-patch -b boot.img --magiskboot ./magiskboot --kmi android15-6.6 --out-name kernelsu_patch.img || exit 1
            echo "✓ Boot image patched with --out-name"
          fi

      - name: Rename patched boot image
        run: |
          cd Kernelsu
          echo "Processing patched boot image..."
          
          # List all files to see what was created
          echo "Files in directory:"
          ls -la
          
          # Find and rename the patched file
          PATCHED_FILE=$(ls -1 kernelsu_patch* 2>/dev/null | head -1)
          if [ -n "$PATCHED_FILE" ]; then
            echo "Found patched file: $PATCHED_FILE"
            rm -f boot.img
            mv "$PATCHED_FILE" boot.img
            echo "✓ Patched image renamed to boot.img"
          else
            echo "Note: No kernelsu_patch* file found, boot.img may already be patched"
            if [ -f "boot.img" ]; then
              ls -lh boot.img
              echo "✓ boot.img exists and ready for next step"
            else
              echo "ERROR: boot.img not found!"
              exit 1
            fi
          fi

      - name: Download AOSP-Testkey-BootSigner for signing
        run: |
          cd Kernelsu
          echo "Cloning AOSP-Testkey-BootSigner..."
          
          git clone https://github.com/rin0011/AOSP-Testkey-BootSigner.git signer || exit 1
          cp boot.img signer/boot.img
          echo "✓ BootSigner cloned and boot.img copied"

      - name: Prepare Python environment
        run: |
          python3 --version
          pip3 --version

      - name: Sign boot image with AVB
        run: |
          cd Kernelsu/signer
          echo "Signing boot image with AVB..."
          
          # Check if required files exist
          if [ ! -f "boot.img" ]; then
            echo "ERROR: boot.img not found!"
            exit 1
          fi
          
          if [ ! -f "rebuild_avb.py" ]; then
            echo "ERROR: rebuild_avb.py not found!"
            echo "Files in signer directory:"
            ls -la
            exit 1
          fi
          
          echo "Executing rebuild_avb.py..."
          python3 rebuild_avb.py --chained-mode || {
            echo "Failed with --chained-mode, trying without it..."
            python3 rebuild_avb.py || exit 1
          }
          
          echo "✓ Boot image signed"

      - name: Verify signed boot image
        run: |
          cd Kernelsu/signer
          
          if [ ! -f "boot.img" ]; then
            echo "ERROR: Signed boot.img not found!"
            exit 1
          fi
          
          echo "Boot image details:"
          ls -lh boot.img
          file boot.img
          
          # Calculate checksum
          sha256sum boot.img > boot.img.sha256
          cat boot.img.sha256
          
          echo "��� Signed boot image ready"

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-boot-img
          path: Kernelsu/signer/boot.img*
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Kernelsu/signer/boot.img
            Kernelsu/signer/boot.img.sha256
          tag_name: kernelsu-build-${{ github.run_number }}
          body: |
            KernelSU patched and signed boot image
            - Build number: ${{ github.run_number }}
            - Build date: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}
            
            This boot.img has been:
            1. Patched with KernelSU (android15-6.6)
            2. Signed with AOSP test keys in chained-mode
            3. Ready for flashing
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
