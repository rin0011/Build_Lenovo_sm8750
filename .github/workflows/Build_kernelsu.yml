name: Build KernelSU Boot Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for AOSP-Testkey-BootSigner (e.g., TB322FC_1.5.10.063)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget unzip git python3 python3-pip jq
          echo "✓ Dependencies installed"

      - name: Create Kernelsu folder
        run: |
          mkdir -p Kernelsu
          cd Kernelsu
          pwd

      - name: Download KernelSU latest releases
        run: |
          cd Kernelsu
          echo "=== Downloading KernelSU components ==="
          
          # Get the latest release information
          LATEST_RELEASE_URL="https://api.github.com/repos/tiann/KernelSU/releases/latest"
          echo "Fetching from: $LATEST_RELEASE_URL"
          
          curl -s -f "$LATEST_RELEASE_URL" > release.json || {
            echo "Failed to download release info"
            exit 1
          }
          
          # Extract tag name
          TAG_NAME=$(jq -r '.tag_name' release.json 2>/dev/null || echo "unknown")
          echo "Release tag: $TAG_NAME"
          
          # Download ksud-x86_64-unknown-linux-musl
          echo "Downloading ksud-x86_64-unknown-linux-musl..."
          KSUD_URL=$(jq -r '.assets[] | select(.name=="ksud-x86_64-unknown-linux-musl") | .browser_download_url' release.json)
          
          if [ -z "$KSUD_URL" ] || [ "$KSUD_URL" == "null" ]; then
            echo "Failed to find ksud-x86_64-unknown-linux-musl"
            echo "Available assets:"
            jq -r '.assets[].name' release.json
            exit 1
          fi
          
          echo "Downloading from: $KSUD_URL"
          wget -q --show-progress "$KSUD_URL" -O ksud || exit 1
          
          # Make it executable with proper permissions
          chmod +x ksud
          chmod 755 ksud
          
          # Verify it's executable
          if file ksud | grep -q "x86-64"; then
            echo "✓ ksud is x86_64 binary"
          fi
          
          ls -lh ksud
          ./ksud --version || echo "Note: Version check may not work in container"
          echo "✓ ksud downloaded and permissions set"
          
          # Download android15-6.6_kernelsu.ko
          echo "Downloading kernel module..."
          KO_URL=$(jq -r '.assets[] | select(.name=="android15-6.6_kernelsu.ko") | .browser_download_url' release.json)
          
          if [ -z "$KO_URL" ] || [ "$KO_URL" == "null" ]; then
            echo "Failed to find kernel module"
            echo "Available assets:"
            jq -r '.assets[].name' release.json
            exit 1
          fi
          
          echo "Downloading from: $KO_URL"
          wget -q --show-progress "$KO_URL" -O android15-6.6_kernelsu.ko || exit 1
          mv android15-6.6_kernelsu.ko android15-6.6
          chmod 644 android15-6.6
          echo "✓ Kernel module downloaded"
          
          rm -f release.json

      - name: Download Magisk and extract magiskboot
        run: |
          cd Kernelsu
          echo "=== Downloading Magisk ==="
          
          MAGISK_URL="https://api.github.com/repos/topjohnwu/Magisk/releases/latest"
          echo "Fetching from: $MAGISK_URL"
          
          curl -s -f "$MAGISK_URL" > magisk_release.json || {
            echo "Failed to download Magisk release"
            exit 1
          }
          
          # Find Magisk APK (not debug version)
          APK_URL=$(jq -r '.assets[] | select(.name | contains(".apk") and (contains("debug") | not)) | .browser_download_url' magisk_release.json | head -1)
          
          if [ -z "$APK_URL" ] || [ "$APK_URL" == "null" ]; then
            echo "Failed to find Magisk APK"
            echo "Available assets:"
            jq -r '.assets[].name' magisk_release.json
            exit 1
          fi
          
          echo "Downloading from: $APK_URL"
          wget -q --show-progress "$APK_URL" -O magisk.apk || exit 1
          
          echo "Extracting magiskboot..."
          mkdir -p magisk_extracted
          unzip -q magisk.apk -d magisk_extracted || exit 1
          
          # Find magiskboot in various locations
          BOOT_FOUND=0
          
          if [ -f "magisk_extracted/lib/x86_64/libmagiskboot.so" ]; then
            cp magisk_extracted/lib/x86_64/libmagiskboot.so magiskboot
            echo "✓ Found libmagiskboot.so (x86_64)"
            BOOT_FOUND=1
          elif [ -f "magisk_extracted/lib/arm64-v8a/libmagiskboot.so" ]; then
            cp magisk_extracted/lib/arm64-v8a/libmagiskboot.so magiskboot
            echo "✓ Found libmagiskboot.so (ARM64)"
            BOOT_FOUND=1
          elif [ -f "magisk_extracted/assets/x86_64/magiskboot" ]; then
            cp magisk_extracted/assets/x86_64/magiskboot magiskboot
            echo "✓ Found magiskboot (assets)"
            BOOT_FOUND=1
          fi
          
          if [ $BOOT_FOUND -eq 0 ]; then
            echo "Failed to find magiskboot"
            echo "Contents:"
            find magisk_extracted -type f -name "*boot*" | head -10
            exit 1
          fi
          
          chmod +x magiskboot
          chmod 755 magiskboot
          rm -rf magisk_extracted magisk.apk magisk_release.json
          echo "✓ Magisk extracted with permissions set"

      - name: Download boot.img from AOSP-Testkey-BootSigner
        run: |
          cd Kernelsu
          echo "=== Downloading boot.img ==="
          
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          RELEASE_TAG="${RELEASE_TAG:-TB322FC_1.5.10.063}"
          
          echo "Using release tag: $RELEASE_TAG"
          
          BOOT_URL="https://api.github.com/repos/rin0011/AOSP-Testkey-BootSigner/releases/tags/$RELEASE_TAG"
          curl -s -f "$BOOT_URL" > bootloader_release.json || {
            echo "Failed to fetch release: $RELEASE_TAG"
            echo "Available releases:"
            curl -s "https://api.github.com/repos/rin0011/AOSP-Testkey-BootSigner/releases" | jq -r '.[].tag_name'
            exit 1
          }
          
          BOOT_URL=$(jq -r '.assets[] | select(.name=="boot.img") | .browser_download_url' bootloader_release.json)
          
          if [ -z "$BOOT_URL" ] || [ "$BOOT_URL" == "null" ]; then
            echo "Failed to find boot.img"
            echo "Available assets:"
            jq -r '.assets[].name' bootloader_release.json
            exit 1
          fi
          
          echo "Downloading from: $BOOT_URL"
          wget -q --show-progress "$BOOT_URL" -O boot.img || exit 1
          chmod 644 boot.img
          echo "✓ boot.img downloaded"
          
          rm -f bootloader_release.json

      - name: Verify all files before patching
        run: |
          cd Kernelsu
          echo "=== Verifying files ==="
          
          for file in ksud android15-6.6 magiskboot boot.img; do
            if [ -f "$file" ]; then
              SIZE=$(ls -lh "$file" | awk '{print $5}')
              PERMS=$(ls -l "$file" | awk '{print $1}')
              echo "✓ $file: $PERMS $SIZE"
            else
              echo "✗ $file: NOT FOUND"
              exit 1
            fi
          done
          
          echo ""
          echo "File types:"
          file ksud magiskboot
          
          echo ""
          echo "All files verified and ready"

      - name: Patch boot image with KernelSU
        run: |
          cd Kernelsu
          echo "=== Patching boot image ==="
          
          echo "Running: ./ksud boot-patch -b boot.img --magiskboot ./magiskboot --kmi android15-6.6"
          ./ksud boot-patch -b boot.img --magiskboot ./magiskboot --kmi android15-6.6 || exit 1
          
          echo "✓ Boot image patched successfully"

      - name: Rename patched boot image
        run: |
          cd Kernelsu
          echo "=== Processing patched image ==="
          
          # List files to see what was created
          echo "Files in directory:"
          ls -la
          
          # Find and rename the patched file
          PATCHED_FILE=$(ls -1 kernelsu_patch* 2>/dev/null | head -1)
          if [ -n "$PATCHED_FILE" ]; then
            echo "Found patched file: $PATCHED_FILE"
            rm -f boot.img
            mv "$PATCHED_FILE" boot.img
            chmod 644 boot.img
            echo "✓ Patched image renamed to boot.img"
          else
            echo "Note: No kernelsu_patch* file found"
            if [ -f "boot.img" ]; then
              ls -lh boot.img
              echo "✓ boot.img exists and ready"
            else
              echo "ERROR: boot.img not found!"
              exit 1
            fi
          fi

      - name: Download AOSP-Testkey-BootSigner for signing
        run: |
          cd Kernelsu
          echo "=== Cloning AOSP-Testkey-BootSigner ==="
          
          git clone https://github.com/rin0011/AOSP-Testkey-BootSigner.git signer || exit 1
          cp boot.img signer/boot.img
          
          echo "Contents of signer directory:"
          ls -la signer/
          
          echo "✓ BootSigner cloned and boot.img copied"

      - name: Sign boot image with AVB
        run: |
          cd Kernelsu/signer
          echo "=== Signing boot image ==="
          
          echo "Current directory: $(pwd)"
          echo "Files present:"
          ls -la
          
          if [ ! -f "boot.img" ]; then
            echo "ERROR: boot.img not found!"
            exit 1
          fi
          
          if [ ! -f "rebuild_avb.py" ]; then
            echo "ERROR: rebuild_avb.py not found!"
            exit 1
          fi
          
          echo "Executing: python3 rebuild_avb.py --chained-mode"
          python3 rebuild_avb.py --chained-mode || {
            echo "Signing with --chained-mode failed, trying without..."
            python3 rebuild_avb.py || exit 1
          }
          
          echo "✓ Boot image signed"

      - name: Verify signed boot image
        run: |
          cd Kernelsu/signer
          echo "=== Final verification ==="
          
          if [ ! -f "boot.img" ]; then
            echo "ERROR: Signed boot.img not found!"
            exit 1
          fi
          
          echo "Boot image details:"
          ls -lh boot.img
          file boot.img
          
          echo ""
          echo "SHA256 checksum:"
          sha256sum boot.img > boot.img.sha256
          cat boot.img.sha256
          
          echo ""
          echo "✓ Signed boot image ready for flashing"

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-boot-img
          path: Kernelsu/signer/boot.img*
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Kernelsu/signer/boot.img
            Kernelsu/signer/boot.img.sha256
          tag_name: kernelsu-build-${{ github.run_number }}
          body: |
            KernelSU patched and signed boot image
            
            Build Information:
            - Build number: ${{ github.run_number }}
            - Build date: ${{ github.event.head_commit.timestamp }}
            - Commit: ${{ github.sha }}
            
            Build Steps Completed:
            1. ✓ Created Kernelsu folder
            2. ✓ Downloaded KernelSU latest release
            3. ✓ Downloaded ksud-x86_64-unknown-linux-musl and patched permissions
            4. ✓ Downloaded android15-6.6_kernelsu.ko kernel module
            5. ✓ Downloaded and extracted Magisk magiskboot
            6. ✓ Downloaded boot.img from AOSP-Testkey-BootSigner
            7. ✓ Patched boot image with KernelSU
            8. ✓ Renamed patched image
            9. ✓ Cloned AOSP-Testkey-BootSigner repository
            10. ✓ Signed boot image with AVB in chained-mode
            
            Ready for Installation:
            This boot.img file is ready to be flashed to your device. It includes:
            - KernelSU kernel module (android15-6.6)
            - Magisk boot integration
            - AOSP test key signature in chained-mode
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
