name: KernelSU Patch & Sign

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'AOSP-Testkey-BootSigner Tag (e.g., v1.0)'
        required: true
        default: 'latest'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (Optional)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 1 & 2. Create Kernelsu & Download KSU Files
        run: |
          # 1. 创建 Kernelsu 文件夹并进入
          mkdir -p Kernelsu
          
          # 2. 从 tiann/KernelSU 下载 ksud 和 ko 模块
          echo "Downloading KernelSU files..."
          gh release download -R tiann/KernelSU -p 'ksud-x86_64-unknown-linux-musl' -O Kernelsu/ksud
          gh release download -R tiann/KernelSU -p 'android15-6.6_kernelsu.ko' -O Kernelsu/android15-6.6_kernelsu.ko
          
          # 将 android15-6.6_kernelsu.ko 重命名为 android15-6.6
          mv Kernelsu/android15-6.6_kernelsu.ko Kernelsu/android15-6.6
          
          # 赋予 ksud 执行权限
          chmod +x Kernelsu/ksud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Download Magisk & Extract Tools
        run: |
          echo "Downloading Latest Magisk..."
          # 下载最新 Magisk APK (移除 -O 以避免多文件匹配错误)
          gh release download -R topjohnwu/Magisk -p '*.apk'
          
          # 查找主 APK 文件 (排除 stub) 并重命名为 magisk.apk
          # Magisk release 通常包含 Magisk-vXX.apk 和 Stub-vXX.apk
          apk_file=$(find . -maxdepth 1 -name "*.apk" ! -name "*stub*" -print -quit)
          echo "Found Magisk APK: $apk_file"
          mv "$apk_file" magisk.apk
          
          # 解压 APK 提取 x86_64/magiskboot.so
          unzip -o magisk.apk 'lib/x86_64/libmagiskboot.so' -d magisk_extract
          
          # 复制到 Kernelsu 文件夹 (并重命名为 magisk 以匹配后续命令参数)
          cp magisk_extract/lib/x86_64/libmagiskboot.so Kernelsu/magisk
          
          # 赋予执行权限
          chmod +x Kernelsu/magisk
          
          # 清理临时文件
          rm magisk.apk
          rm -f *.apk # 清理剩余的 stub apk
          rm -rf magisk_extract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Download init_boot.img & vbmeta.img
        run: |
          echo "Downloading images from rin0011/AOSP-Testkey-BootSigner..."
          
          REPO_OWNER="rin0011/AOSP-Testkey-BootSigner"
          TAG="${{ inputs.release_tag }}"
          
          # 尝试使用 gh release download 下载
          echo "Attempting download from Release/Tag: $TAG via GitHub CLI..."
          
          TAG_ARG=""
          if [ "$TAG" != "latest" ]; then
            TAG_ARG="--tag $TAG"
          fi

          if gh release download -R $REPO_OWNER $TAG_ARG -p 'init_boot.img' && \
             gh release download -R $REPO_OWNER $TAG_ARG -p 'vbmeta.img'; then
             echo "Download via gh release successful."
          else
             echo "gh release failed (likely no release found). Falling back to raw file download..."
             
             # 如果 tag 是 latest，为了 raw URL 我们需要一个确切的分支或tag
             # 这里假设 latest 对应 main 分支，如果是特定 tag 则使用 tag
             if [ "$TAG" == "latest" ]; then
                TARGET_REF="main"
             else
                TARGET_REF="$TAG"
             fi
             
             BASE_URL="https://github.com/$REPO_OWNER/raw/$TARGET_REF"
             echo "Downloading from: $BASE_URL"
             
             wget -O init_boot.img "$BASE_URL/init_boot.img" || { echo "Failed to download init_boot.img"; exit 1; }
             wget -O vbmeta.img "$BASE_URL/vbmeta.img" || { echo "Failed to download vbmeta.img"; exit 1; }
             
             echo "Download via wget successful."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. Execute ksud boot-patch
        run: |
          cd Kernelsu
          echo "Executing ksud boot-patch..."
          # 执行修补命令，注意路径引用
          ./ksud boot-patch -b ../init_boot.img --magiskboot ./magisk --kmi android15-6.6

      - name: 6. Replace init_boot.img
        run: |
          # 删除原始 init_boot.img
          rm init_boot.img
          
          # 将生成的 kernelsu_patch.* 重命名为 init_boot.img 并移动到根目录
          find Kernelsu -name "kernelsu_patch*.img" -exec mv {} init_boot.img \;
          
          echo "Patched image renamed to init_boot.img"

      - name: 7. Sign Images with AOSP-Testkey-BootSigner
        run: |
          echo "Cloning BootSigner repo..."
          # 下载签名工具仓库
          git clone https://github.com/rin0011/AOSP-Testkey-BootSigner.git signer_tool
          
          # 将步骤 6 的 init_boot.img 复制到此
          cp init_boot.img signer_tool/
          
          # 为了方便最终上传，也将 vbmeta 复制进去（虽然 Python 脚本主要处理 boot 镜像）
          cp vbmeta.img signer_tool/
          
          cd signer_tool
          
          echo "Installing python dependencies if needed..."
          pip install protobuf || true
          
          echo "Executing rebuild_avb.py..."
          python3 rebuild_avb.py --chained-mode
          
          # 验证生成结果
          ls -l

      - name: 8. Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Patched-Signed-Images
          path: |
            signer_tool/init_boot.img
            signer_tool/vbmeta.img
