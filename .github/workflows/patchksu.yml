name: KernelSU Patch & Sign Workflow

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'AOSP-Testkey-BootSigner Release Tag (e.g., v1.0)'
        required: true
        type: string
        default: 'latest'

jobs:
  patch-and-sign:
    runs-on: ubuntu-latest
    
    steps:
    # 基础环境准备
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 步骤 1 & 2: 创建文件夹并下载 KernelSU 相关文件
    - name: Setup KernelSU Files
      run: |
        # 1. 创建 Kernelsu 文件夹
        mkdir -p Kernelsu
        
        # 2. 下载 ksud 和内核模块
        echo "Downloading KernelSU files..."
        wget -O Kernelsu/ksud "https://github.com/tiann/KernelSU/releases/latest/download/ksud-x86_64-unknown-linux-musl"
        wget -O Kernelsu/android15-6.6 "https://github.com/tiann/KernelSU/releases/latest/download/android15-6.6_kernelsu.ko"
        
        echo "KernelSU files downloaded."

    # 步骤 3: 下载并提取 Magiskboot
    - name: Setup Magiskboot
      run: |
        echo "Downloading Magisk..."
        wget -O Magisk.apk "https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk"
        
        echo "Extracting magiskboot..."
        # 注意：Magisk APK 中 magiskboot 通常位于 lib/x86_64/libmagiskboot.so
        # 我们使用 unzip -j (junk paths) 直接提取文件而不保留目录结构
        unzip -j Magisk.apk "lib/x86_64/libmagiskboot.so" -d Kernelsu/
        
        # 重命名为 magiskboot.so 以匹配你的指令
        mv Kernelsu/libmagiskboot.so Kernelsu/magiskboot.so
        echo "Magiskboot setup complete."

    # 步骤 4: 下载指定 Tag 的镜像文件
    - name: Download Images
      env:
        TAG_NAME: ${{ inputs.tag }}
      run: |
        echo "Downloading images for tag: $TAG_NAME"
        # 假设下载链接格式为 releases/download/<tag>/<filename>
        wget "https://github.com/rin0011/AOSP-Testkey-BootSigner/releases/download/$TAG_NAME/init_boot.img"
        wget "https://github.com/rin0011/AOSP-Testkey-BootSigner/releases/download/$TAG_NAME/vbmeta.img"
        
        ls -lh *.img

    # 步骤 5: 执行 ksud boot-patch
    - name: Run KernelSU Patch
      run: |
        echo "Setting permissions..."
        chmod +x Kernelsu/ksud
        chmod +x Kernelsu/magiskboot.so
        
        echo "Running patch..."
        ./Kernelsu/ksud boot-patch \
          -b init_boot.img \
          --magiskboot Kernelsu/magiskboot.so \
          --kmi android15-6.6

    # 步骤 6: 处理生成的文件
    - name: Rename Patched Image
      run: |
        echo "Removing original init_boot.img..."
        rm init_boot.img
        
        echo "Renaming patch result..."
        # 查找 kernelsu_patch*.img 并重命名为 init_boot.img
        mv kernelsu_patch*.img init_boot.img
        
        ls -lh init_boot.img

    # 步骤 7: 重新签名 (Rebuild AVB)
    - name: Rebuild AVB Signing
      run: |
        # 克隆仓库到临时目录 'signer_temp'
        git clone https://github.com/rin0011/AOSP-Testkey-BootSigner.git signer_temp
        
        # 复制文件到克隆目录
        cp init_boot.img signer_temp/
        
        # 进入目录并执行脚本
        cd signer_temp
        echo "Running rebuild_avb.py..."
        python3 rebuild_avb.py --chained-mode
        
        # 将处理后的文件移回工作流根目录，覆盖之前的 init_boot.img
        mv init_boot.img ../init_boot.img
        cd ..
        
        echo "Signing complete."

    # 步骤 8: 上传构建产物
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: patched-images
        path: |
          init_boot.img
          vbmeta.img
