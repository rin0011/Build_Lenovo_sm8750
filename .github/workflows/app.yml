name: Android CI - Build Box APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:

    - name: 检出代码仓库
      uses: actions/checkout@v4
      with:
        repository: mlabalabala/box
        ref: main
    
    - name: 设置Java环境
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    # 3. 生成签名文件(用于Release编译)
    # - name: 生成调试签名文件
    #   run: |
    #     cd app
    #     keytool -genkey -v -keystore BUNNY.jks -keyalg RSA -keysize 2048 -validity 10000 \
    #       -alias bunny -keypass 426000 -storepass 000624 \
    #       -dname "CN=GitHub Actions, OU=CI, O=CI, L=Beijing, ST=Beijing, C=CN"
    #     cd ..

    - name: 赋予gradlew执行权限
      run: chmod 777 gradlew
    
    # 5. 缓存Gradle依赖
    - name: 缓存Gradle依赖
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    # 6. 编译Release版本APK
    - name: 编译Release APK
      run: ./gradlew assembleRelease --stacktrace

    
    # 7. 上传APK到Artifacts
    - name: 上传APK文件
      uses: actions/upload-artifact@v4
      with:
        name: box-release-apk
        path: Release/*.apk
        retention-days: 30
    
    # 8. 显示编译信息
    - name: 显示编译产物信息
      run: |
        echo "=== 编译完成 ==="
        ls -lh app/build/outputs/apk/release/
        echo "APK文件已上传到Artifacts，可在Actions页面下载"
