name: Android CI - Build Box APK

# 触发条件
on:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出代码
    - name: 检出代码仓库
      uses: actions/checkout@v4
      with:
        repository: mlabalabala/box
        ref: main
    
    # 2. 设置Java环境
    - name: 设置Java 11环境
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    # 3. 赋予Gradle执行权限
    - name: 赋予gradlew执行权限
      run: chmod +x gradlew
    
    # 4. 缓存Gradle依赖
    - name: 缓存Gradle依赖
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    # 5. 编译Debug版本APK
    - name: 编译Debug APK
      run: ./gradlew assembleDebug --stacktrace
    
    # 6. 上传APK到Artifacts
    - name: 上传APK文件
      uses: actions/upload-artifact@v4
      with:
        name: box-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
    
    # 7. 显示编译信息
    - name: 显示编译产物信息
      run: |
        echo "=== 编译完成 ==="
        ls -lh app/build/outputs/apk/debug/
        echo "APK文件已上传到Artifacts，可在Actions页面下载"
